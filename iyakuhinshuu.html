*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;background:#f0f3f8;color:#1a1a2e;min-height:100vh;padding-bottom:env(safe-area-inset-bottom);}

/* ヘッダー */
header{position:sticky;top:0;z-index:200;background:#1a3a6b;padding:calc(10px + env(safe-area-inset-top)) 14px 8px;box-shadow:0 2px 10px rgba(0,0,0,.3);}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
header h1{color:#fff;font-size:16px;font-weight:800;letter-spacing:.04em;}
.header-badge{background:#4a90d9;color:#fff;font-size:10px;border-radius:10px;padding:2px 8px;font-weight:700;}
.search-wrap{position:relative;}
.search-wrap input{width:100%;padding:9px 38px 9px 36px;border:none;border-radius:10px;font-size:15px;background:#fff;color:#1a1a2e;outline:none;-webkit-appearance:none;}
.search-wrap input::placeholder{color:#aaa;}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:15px;color:#999;pointer-events:none;}
.search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:18px;color:#999;cursor:pointer;display:none;line-height:1;padding:2px;}
.search-clear.vis{display:block;}

/* タブ */
.tabs{display:flex;background:#fff;border-bottom:2px solid #e8eef7;}
.tab{flex:1;padding:10px 4px;text-align:center;font-size:13px;font-weight:600;color:#888;cursor:pointer;border-bottom:3px solid transparent;transition:color .15s,border-color .15s;}
.tab.active{color:#1a3a6b;border-bottom-color:#1a3a6b;}

/* ステータスバー */
.status-bar{background:#e8eef7;padding:5px 14px;font-size:11px;color:#666;display:flex;justify-content:space-between;align-items:center;}

/* メイン */
main{padding:10px 10px 100px;}

/* 検索結果 */
#search-view{display:none;}
#cat-view{display:block;}
.no-result{text-align:center;padding:50px 20px;color:#aaa;font-size:15px;}

/* 検索結果カード */
.sr-card{background:#fff;border-radius:10px;margin-bottom:8px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.08);border-left:4px solid #1a3a6b;}
.sr-card.drug-card{border-left-color:#4a90d9;}
.sr-type{font-size:10px;font-weight:800;letter-spacing:.05em;color:#fff;background:#1a3a6b;border-radius:4px;padding:2px 6px;display:inline-block;margin-bottom:5px;}
.drug-card .sr-type{background:#4a90d9;}
.sr-text{font-size:14px;font-weight:700;line-height:1.4;color:#1a1a2e;}
.sr-text mark{background:#fff176;border-radius:2px;padding:0 1px;}
.sr-parent{font-size:11px;color:#888;margin-top:3px;}

/* アコーディオン */
.major-block{background:#fff;border-radius:12px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 5px rgba(0,0,0,.08);}
.major-hdr{display:flex;align-items:center;padding:12px 14px;cursor:pointer;gap:10px;}
.major-hdr:active{background:#f0f4fb;}
.major-num{font-size:12px;font-weight:900;color:#fff;background:#1a3a6b;border-radius:7px;min-width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.major-name{font-size:14px;font-weight:700;color:#1a1a2e;flex:1;line-height:1.4;}
.major-meta{font-size:11px;color:#aaa;flex-shrink:0;}
.chevron{font-size:11px;color:#bbb;flex-shrink:0;transition:transform .2s;}
.major-block.open .chevron{transform:rotate(180deg);}

.minor-area{display:none;border-top:1px solid #eef1f8;}
.major-block.open .minor-area{display:block;}

.minor-hdr{display:flex;align-items:center;padding:9px 14px 9px 14px;cursor:pointer;gap:8px;background:#f8faff;border-bottom:1px solid #eef1f8;}
.minor-hdr:active{background:#edf2fb;}
.minor-dot{width:5px;height:5px;border-radius:50%;background:#4a90d9;flex-shrink:0;}
.minor-num{font-size:11px;color:#4a90d9;font-weight:700;flex-shrink:0;}
.minor-name{font-size:13px;color:#334;font-weight:600;flex:1;line-height:1.4;}
.minor-cnt{font-size:10px;color:#aaa;flex-shrink:0;}
.minor-chev{font-size:10px;color:#ccc;flex-shrink:0;transition:transform .2s;}
.minor-block.open .minor-chev{transform:rotate(180deg);}

.drug-area{display:none;background:#fff;}
.minor-block.open .drug-area{display:block;}

/* 薬品カード */
.drug-item{padding:10px 14px 10px 22px;border-bottom:1px solid #f4f6fb;display:flex;align-items:flex-start;gap:8px;}
.drug-item:last-child{border-bottom:none;}
.drug-info{flex:1;min-width:0;}
.drug-name{font-size:13px;font-weight:700;color:#1a1a2e;line-height:1.4;word-break:break-all;}
.drug-generic{font-size:11px;color:#666;margin-top:2px;line-height:1.4;}
.drug-spec{font-size:10px;color:#999;margin-top:2px;}
.drug-badges{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;}
.badge{font-size:10px;font-weight:700;border-radius:4px;padding:1px 6px;white-space:nowrap;}
.badge-route-両{background:#e3f0ff;color:#1a3a6b;}
.badge-route-内{background:#e8f7e8;color:#1a7a1a;}
.badge-route-外{background:#fff3e3;color:#9a6000;}
.badge-form{background:#f0f0f0;color:#555;}
.drug-actions{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;padding-top:2px;}
.fav-btn{background:none;border:none;font-size:18px;cursor:pointer;line-height:1;padding:2px;opacity:.4;transition:opacity .15s,transform .15s;}
.fav-btn.active{opacity:1;transform:scale(1.1);}
.memo-btn{background:none;border:none;font-size:15px;cursor:pointer;line-height:1;padding:2px;opacity:.4;}
.memo-btn.has-memo{opacity:1;}

/* メモモーダル */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:flex-end;}
.modal-overlay.open{display:flex;}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:20px 18px 40px;width:100%;max-height:70vh;display:flex;flex-direction:column;}
.modal-title{font-size:15px;font-weight:700;margin-bottom:12px;color:#1a1a2e;}
.modal textarea{width:100%;border:1px solid #dde4f0;border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;resize:none;height:120px;outline:none;color:#1a1a2e;}
.modal-actions{display:flex;gap:10px;margin-top:12px;}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;}
.btn-cancel{background:#f0f0f0;color:#555;}
.btn-save{background:#1a3a6b;color:#fff;}
.btn-delete{background:#fee;color:#c00;}

/* お気に入りタブ */
#fav-view{display:none;}
.fav-empty{text-align:center;padding:60px 20px;color:#aaa;font-size:14px;}

/* フッター */
footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dde4f0;padding:6px 16px calc(6px + env(safe-area-inset-bottom));text-align:center;font-size:10px;color:#bbb;}

// ─── 状態 ─────────────────────────────────────────────
let favorites = JSON.parse(localStorage.getItem('med_favs') || '[]');
let memos     = JSON.parse(localStorage.getItem('med_memos') || '{}');
let currentMemoKey = null;
let currentTab = 'all';

// ─── ユーティリティ ───────────────────────────────────
function norm(s) {
  return s
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[ぁ-ん]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60))
    .toUpperCase();
}
function hl(text, q) {
  if (!q) return text;
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  return text.replace(re, m => `<mark>${m}</mark>`);
}
function drugKey(d) { return d.name + '|' + d.minor_num; }
function isFav(d)   { return favorites.includes(drugKey(d)); }

const ROUTE_LABEL = {'両':'両用','内':'内用','外':'外用'};
function routeBadge(r) {
  return `<span class="badge badge-route-${r}">${ROUTE_LABEL[r]||r}</span>`;
}
function formBadge(f) {
  return `<span class="badge badge-form">${f}</span>`;
}

// ─── 薬品カード HTML ───────────────────────────────────
function drugCardHTML(d, q) {
  const key = drugKey(d);
  const fav = isFav(d);
  const memo = memos[key] || '';
  return `
  <div class="drug-item" data-key="${key.replace(/"/g,'&quot;')}">
    <div class="drug-info">
      <div class="drug-name">${hl(d.name, q)}</div>
      ${d.generic ? `<div class="drug-generic">【一般名】${hl(d.generic, q)}</div>` : ''}
      ${d.spec    ? `<div class="drug-spec">${d.spec}</div>` : ''}
      <div class="drug-badges">
        ${d.route ? routeBadge(d.route) : ''}
        ${d.form  ? formBadge(d.form)   : ''}
      </div>
    </div>
    <div class="drug-actions">
      <button class="fav-btn ${fav?'active':''}" onclick="toggleFav(this,'${key.replace(/'/g,"\\'")}','${d.name.replace(/'/g,"\\'")}')">
        ${fav?'★':'☆'}
      </button>
      <button class="memo-btn ${memo?'has-memo':''}" onclick="openMemo('${key.replace(/'/g,"\\'")}','${d.name.replace(/'/g,"\\'")}')">
        ${memo?'📝':'📄'}
      </button>
    </div>
  </div>`;
}

// ─── カテゴリビュー構築 ────────────────────────────────
function buildCatView() {
  const catView = document.getElementById('cat-view');
  const drugsByMinor = {};
  DRUGS.forEach(d => {
    const k = d.major_num + '|' + d.minor_num;
    if (!drugsByMinor[k]) drugsByMinor[k] = [];
    drugsByMinor[k].push(d);
  });

  let majorBlock = null;
  let minorBlock = null;
  const html = [];

  CATS.forEach(([type, text]) => {
    if (type === 'major') {
      if (majorBlock) html.push('</div></div>');
      const m = text.match(/^([０-９]+)\s+(.+)/);
      const num = m ? m[1] : '';
      const name = m ? m[2] : text;
      // 大分類の薬品数
      const majorNum = num;
      let cnt = 0;
      for (const k in drugsByMinor) {
        if (k.startsWith(majorNum + '|')) cnt += drugsByMinor[k].length;
      }
      html.push(`
      <div class="major-block" id="maj-${num}">
        <div class="major-hdr" onclick="toggleMajor(this)">
          <div class="major-num">${num}</div>
          <div class="major-name">${name}</div>
          <div class="major-meta">${cnt}剤</div>
          <div class="chevron">▼</div>
        </div>
        <div class="minor-area">`);
      majorBlock = num;
      minorBlock = null;

    } else if (type === 'minor') {
      const m = text.match(/^([０-９．]+)\s+(.+)/);
      const num = m ? m[1] : '';
      const name = m ? m[2] : text;
      const majorNum = majorBlock;
      const k = majorNum + '|' + num;
      const drugs = drugsByMinor[k] || [];
      const drugHTML = drugs.map(d => drugCardHTML(d, '')).join('');
      html.push(`
        <div class="minor-block" id="min-${num.replace(/．/g,'-')}">
          <div class="minor-hdr" onclick="toggleMinor(this)">
            <div class="minor-dot"></div>
            <div class="minor-num">${num}</div>
            <div class="minor-name">${name}</div>
            <div class="minor-cnt">${drugs.length}剤</div>
            <div class="minor-chev">▼</div>
          </div>
          <div class="drug-area">${drugHTML}</div>
        </div>`);
    }
  });
  if (majorBlock) html.push('</div></div>');
  catView.innerHTML = html.join('');
}

// ─── アコーディオン制御 ────────────────────────────────
function toggleMajor(hdr) {
  hdr.parentElement.classList.toggle('open');
}
function toggleMinor(hdr) {
  hdr.parentElement.classList.toggle('open');
}

// ─── 検索 ─────────────────────────────────────────────
const searchInput = document.getElementById('searchInput');
const clearBtn    = document.getElementById('clearBtn');
const searchView  = document.getElementById('search-view');
const catView     = document.getElementById('cat-view');
const statusText  = document.getElementById('statusText');

searchInput.addEventListener('input', doSearch);

function doSearch() {
  const q = searchInput.value.trim();
  clearBtn.classList.toggle('vis', q.length > 0);
  if (!q) {
    searchView.style.display = 'none';
    catView.style.display    = currentTab === 'all' ? 'block' : 'none';
    updateStatus();
    return;
  }
  const nq = norm(q);
  const hits = [];
  CATS.forEach(([type, text]) => {
    if (norm(text).includes(nq)) {
      hits.push({type: type === 'major' ? 'major' : 'minor', text, parent: null});
    }
  });
  DRUGS.forEach(d => {
    if (norm(d.name).includes(nq) || norm(d.generic).includes(nq)) {
      hits.push({type: 'drug', drug: d});
    }
  });
  searchView.style.display = 'block';
  catView.style.display    = 'none';
  statusText.textContent   = `検索結果 ${hits.length} 件`;
  if (!hits.length) {
    searchView.innerHTML = `<div class="no-result">「${q}」に一致する結果がありません</div>`;
    return;
  }
  const parts = hits.map(h => {
    if (h.type === 'drug') {
      return `<div class="sr-card drug-card">${drugCardHTML(h.drug, q)}</div>`;
    }
    const label = h.type === 'major' ? '大分類' : '中分類';
    const cls   = h.type === 'major' ? '' : 'drug-card';
    return `<div class="sr-card ${cls}">
      <div class="sr-type">${label}</div>
      <div class="sr-text">${hl(h.text, q)}</div>
    </div>`;
  });
  searchView.innerHTML = parts.join('');
}

function clearSearch() {
  searchInput.value = '';
  doSearch();
  searchInput.focus();
}

// ─── タブ切り替え ──────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  const q = searchInput.value.trim();
  catView.style.display    = (tab === 'all' && !q) ? 'block' : 'none';
  searchView.style.display = (q) ? 'block' : 'none';
  document.getElementById('fav-view').style.display = (tab === 'fav') ? 'block' : 'none';
  if (tab === 'fav') buildFavView();
  updateStatus();
}

// ─── お気に入り ────────────────────────────────────────
function toggleFav(btn, key, name) {
  const idx = favorites.indexOf(key);
  if (idx === -1) { favorites.push(key); }
  else            { favorites.splice(idx, 1); }
  localStorage.setItem('med_favs', JSON.stringify(favorites));
  const active = favorites.includes(key);
  // 全ボタン更新
  document.querySelectorAll(`.fav-btn`).forEach(b => {
    const item = b.closest('[data-key]');
    if (item && item.dataset.key === key) {
      b.className = 'fav-btn' + (active ? ' active' : '');
      b.textContent = active ? '★' : '☆';
    }
  });
  if (currentTab === 'fav') buildFavView();
  updateStatus();
}

function buildFavView() {
  const favList  = document.getElementById('favList');
  const favEmpty = document.getElementById('favEmpty');
  if (!favorites.length) {
    favEmpty.style.display = 'block';
    favList.innerHTML = '';
    return;
  }
  favEmpty.style.display = 'none';
  const favDrugs = DRUGS.filter(d => favorites.includes(drugKey(d)));
  favList.innerHTML = favDrugs.map(d =>
    `<div class="major-block" style="margin-bottom:8px;">
      <div style="padding:6px 14px 0;font-size:11px;color:#4a90d9;font-weight:700;">${d.minor_num} ${d.minor}</div>
      ${drugCardHTML(d, '')}
    </div>`
  ).join('');
}

// ─── メモ ──────────────────────────────────────────────
function openMemo(key, name) {
  currentMemoKey = key;
  document.getElementById('modalTitle').textContent = name;
  document.getElementById('modalTextarea').value = memos[key] || '';
  const hasM = !!memos[key];
  document.getElementById('memoDeleteBtn').style.display = hasM ? 'block' : 'none';
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  currentMemoKey = null;
}
function closeModalOutside(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}
function saveMemo() {
  const val = document.getElementById('modalTextarea').value.trim();
  if (val) {
    memos[currentMemoKey] = val;
  } else {
    delete memos[currentMemoKey];
  }
  localStorage.setItem('med_memos', JSON.stringify(memos));
  updateMemoButtons();
  closeModal();
}
function deleteMemo() {
  delete memos[currentMemoKey];
  localStorage.setItem('med_memos', JSON.stringify(memos));
  updateMemoButtons();
  closeModal();
}
function updateMemoButtons() {
  document.querySelectorAll('[data-key]').forEach(item => {
    const key  = item.dataset.key;
    const btn  = item.querySelector('.memo-btn');
    if (!btn) return;
    const hasM = !!memos[key];
    btn.className = 'memo-btn' + (hasM ? ' has-memo' : '');
    btn.textContent = hasM ? '📝' : '📄';
  });
}

// ─── ステータス ────────────────────────────────────────
function updateStatus() {
  const favCnt = favorites.length;
  const q = searchInput.value.trim();
  if (q) return;
  if (currentTab === 'fav') {
    statusText.textContent = `お気に入り ${favCnt} 件`;
  } else {
    statusText.textContent = `大分類 ${CATS.filter(c=>c[0]==='major').length} 件  中分類 ${CATS.filter(c=>c[0]==='minor').length} 件  薬品 ${DRUGS.length} 件`;
  }
  document.getElementById('filterInfo').textContent = favCnt ? `★${favCnt}` : '';
}

// ─── 初期化 ────────────────────────────────────────────
document.getElementById('totalBadge').textContent = DRUGS.length + '剤';
buildCatView();
updateStatus();
</script>
</body>
</html>
